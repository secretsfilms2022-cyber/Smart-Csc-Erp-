name: Deploy Smart CSC ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-csc-erp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and syntax check
        run: npm run check
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Production smoke test
        run: |
          node --input-type=module - <<'NODE'
          const base = "https://smart-csc-erp.smartcscgorakhpur.workers.dev";
          const health = await fetch(base + "/health", { cache: "no-store" });
          if (!health.ok) throw new Error("Health check failed: HTTP " + health.status);
          const healthJson = await health.json();
          if (!healthJson.ok || healthJson.service !== "smart-csc-erp") {
            throw new Error("Health check returned an unexpected payload");
          }
          const page = await fetch(base + "/", { cache: "no-store" });
          if (!page.ok) throw new Error("ERP page check failed: HTTP " + page.status);
          const pageHtml = await page.text();
          if (!pageHtml.includes("Smart CSC Gorakhpur ERP")) {
            throw new Error("ERP page did not return the expected login shell");
          }
          if (/[ÃÂâ]{2,}/.test(pageHtml)) {
            throw new Error("ERP page still contains UTF-8 mojibake");
          }
          const appJs = await fetch(base + "/app.js", { cache: "no-store" });
          if (!appJs.ok) throw new Error("ERP app.js check failed: HTTP " + appJs.status);
          const challenge = "ci-" + Date.now();
          const webhook = await fetch(base + "/api/email/webhook", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ type: "verification", challenge })
          });
          if (!webhook.ok) throw new Error("Webhook verification smoke test failed: HTTP " + webhook.status);
          const webhookJson = await webhook.json();
          if (webhookJson.challenge !== challenge) {
            throw new Error("Webhook verification challenge was not echoed");
          }
          console.log("Production smoke tests passed.");
          NODE
